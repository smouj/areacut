  <!-- Tagline -->
  <text x="640" y="570" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#888888" letter-spacing="3">CUT · REFRAIN · CAPTION · EXPORT</text>
</svg>
