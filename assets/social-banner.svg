    <line x1="0" y1="640" x2="1280" y2="0"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
  </g>
  <!-- Corner brackets -->
  <g stroke="#FFFFFF" stroke-width="40" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M380,160 L380,60 L480,60"/>
    <path d="M800,60 L900,60 L900,160"/>
    <path d="M380,480 L380,580 L480,580"/>
